name: Bundle Sync

on:
  push:
    branches:
      - "feature/law-title-autocomplete-v1"
    paths:
      - ".github/workflows/bundle-sync.yml"

permissions:
  contents: read

jobs:
  sync-main-js:
    if: github.repository == 'GammaFunds/European-Law-Lookup' && github.ref == 'refs/heads/feature/law-title-autocomplete-v1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/checkout v4.2.2
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/law-title-autocomplete-v1
          fetch-depth: 1

      # actions/setup-node v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Enforce generated-file scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "main.js"
          git diff --check

      - name: Commit generated main.js
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- main.js
          git diff --cached --name-only | grep -Fxq 'main.js'
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m "build: update autocomplete bundle"
          git push origin "HEAD:feature/law-title-autocomplete-v1"
