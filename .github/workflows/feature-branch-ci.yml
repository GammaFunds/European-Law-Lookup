name: Feature Branch CI

on:
  push:
    branches:
      - "feature/law-title-suggestions-v1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build bundle
        run: npm run build

      - name: Check diff whitespace
        run: git diff --check

      - name: Upload generated bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-main-js
          path: main.js
          if-no-files-found: error

      - name: Verify committed bundle matches generated bundle
        run: git diff --exit-code -- main.js
